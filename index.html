<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代理万物 - 正在跳转…</title>
  <!-- 兜底页：仅当部署时输出目录被误配为仓库根目录（./）才会被访问到。
       正确配置（输出目录 = static）时，EdgeOne Pages 会直接使用 static/index.html，
       本文件不会出现在部署产物中。 -->
  <meta http-equiv="refresh" content="0; url=./static/index.html">
  <style>
    body { font-family: system-ui, sans-serif; background: #667eea; color: #fff;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    a { color: #fff; }
  </style>
</head>
<body>
  <p>正在进入代理首页，<a href="./static/index.html">如果没有自动跳转请点击这里</a>。</p>
</body>
</html>
